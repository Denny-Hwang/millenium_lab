key_insights:
  - "H1's strict form is refuted at theorem level, twice independently: Rothvoss 2014 + Edmonds 1965 (perfect matching is in P yet its polytope has 2^Omega(n) extension complexity) on the LP side; Grigoriev 2001 / Schoenebeck 2008 + Gaussian elimination (parity / 3-XOR are in P yet require Omega(n) SOS degree) on the SOS side. Positive-dimensional semialgebraic invariants assign maximal hardness to problems uniform machines solve in polynomial time."
  - "Model-lift wall (refines C-002): no positive-dimensional invariant on record is simultaneously model-faithful and uniform-faithful. The semialgebraic family is the FOURTH instance (after monotone-to-general, arithmetic-to-Boolean / G019, decision-tree-to-uniform) and the first that is positive-dimensional AND model-hardness-faithful — strictly better than G019's hardness-blindness, so the wall's landscape is genuinely refined. Lifting theorems (Raz-McKenzie; Goos-Pitassi-Watson) compose sideways between restricted models, never upward to uniform ones; a canonical simulation theorem is provably false for every canonical encoding on the books, and abandoning canonicity destroys the moduli structure — C-002's dilemma reborn one level up."
  - "XOR / characteristic-2 boundary (new organizing principle): XOR sits on the wrong side of every algebraic encoding tried, in BOTH directions — char-0 arithmetic makes it too easy (G019); ordered-real static certificates make it too hard (Grigoriev/Schoenebeck); adaptive char-2 computation (Gaussian elimination) keeps it uniformly easy. Proposed as an explicit amendment path for C-002: any continuous encoding must survive the mod-2 test in both directions."
  - "Warren-duality: the same theorems (Warren 1968 / Milnor-Thom / o-minimal cell decomposition) simultaneously cap tame encoding power (the wall) and power every tame-model lower bound (Ben-Or; Steele-Yao). The trigger's o-minimal hope inverts — tameness is the wall axiomatized, and its productive use is restricted-model lower bounds, not wall-crossing."
  - "Four residual cracks named as forward paths: (i) psd rank of the perfect matching polytope (open; either resolution informative); (ii) Cook-Levin tableau-based spectrahedral encodings (unexplored; plausibly non-relativizing; no lower-bound technology exists); (iii) bounded-cancellation arithmetic models (the untested half of trigger (1)); (iv) GLS separation-vs-optimization names the escape hatch polytope-based moduli are blind to — a separation-complexity invariant is unexamined. Also recorded: Raghavendra's UGC-conditional SDP-optimality for Max-CSP approximation is the strongest surviving pro-H1 regime (approximation, not exact decision)."
