key_insights:
  - "No residual crack from A012 was resolved externally between 2026-07 and 2026-08: the psd rank of the perfect matching polytope remains explicitly open (only fixed-block-size SDP lower bounds for the cut polytope and LP-approximation lower bounds for matching are known); Cook-Levin tableau spectrahedral encodings are untouched in the literature; bounded-cancellation arithmetic models are unmoved beyond Hrubes's standing program; and no lifting theorem composes upward to uniform models."
  - "The model-lift wall gained a sharper witness inside the monotone family: de Rezende-Vinyals (CCC 2025, Lifting with Colourful Sunflowers) prove an exp(Omega(n^(1/3-eps))) monotone circuit lower bound for a function in P via DAG-like lifting over non-binary alphabets, surpassing the approximation method - a model-restricted invariant assigning near-maximal hardness to a uniformly-easy function, obtained by the very lifting machinery crack (iv) asks about."
  - "Lifting technology advanced (colourful-sunflower DAG lifting; deterministic one-way NOF lifting, ECCC TR25-073) and still composes only between restricted models, consistent with A012 K2's sideways-never-upward characterization."
  - "Algebraic natural proofs are WLOG isotypic at quasipolynomial cost (van den Berg-Dutta-Gesmundo-Ikenmeyer-Lysikov, CCC 2025, via PBW + Gelfand-Tsetlin), closing the symmetry loophole in barrier audits relevant to B-002 and to any future C-002-style route."
  - "The largest genuine movement adjacent to the problem is on an axis outside C-002's quantification: Williams (STOC 2025) TIME[t] in SPACE[sqrt(t log t)] with explicit n^2/polylog time lower bounds for O(n)-space problems, and the catalytic TreeEval follow-up (Henzinger-Pyne-Ragavan, ECCC TR26-022) with O(log n) free space - targeting P vs PSPACE, bridge-shaped for this repository but not yet registered."
claims:
  - id: A013-K1
    kind: finding
    status: unformalized
    formalizability: not-mathematical
    statement: "As of 2026-08, none of A012's four residual cracks is resolved in the external literature: the psd rank of the perfect matching polytope is explicitly open, spectrahedral encodings of computation tableaux are unstudied, bounded-cancellation arithmetic models are unmoved, and no lifting theorem reaches uniform models."
  - id: A013-K2
    kind: cited-theorem
    status: unformalized
    formalizability: needs-infrastructure
    statement: "de Rezende and Vinyals (CCC 2025) prove an exp(Omega(n^(1/3-eps))) monotone circuit lower bound for a function in P via DAG-like lifting over non-binary alphabets, a stronger model-faithful-but-not-uniform-faithful witness than the approximation method provides; a Boolean and monotone circuit model is not in mathlib."
  - id: A013-K3
    kind: finding
    status: unformalized
    formalizability: shape-only
    statement: "The 2025-2026 lifting theorems (colourful-sunflower DAG lifting, one-way NOF lifting) compose between restricted models and not upward to uniform ones, leaving A012's model-lift characterization unrefuted."
  - id: A013-K4
    kind: cited-theorem
    status: unformalized
    formalizability: needs-infrastructure
    statement: "Williams (STOC 2025) shows TIME[t] is contained in SPACE[sqrt(t log t)] on multitape machines, and Henzinger-Pyne-Ragavan (ECCC TR26-022) give catalytic TreeEval with O(log n) free space and polynomial time; this time-space axis lies outside the encoding family C-002 quantifies over and targets P vs PSPACE; mathlib has no machine model."
  - id: A013-K5
    kind: cited-theorem
    status: unformalized
    formalizability: needs-infrastructure
    statement: "van den Berg, Dutta, Gesmundo, Ikenmeyer and Lysikov (CCC 2025) show isotypic decomposition of metapolynomials costs only a quasipolynomial circuit-size blowup, so algebraic natural proofs are WLOG isotypic; mathlib has no algebraic circuit or metapolynomial infrastructure."
  - id: A013-K6
    kind: methodological
    status: unformalized
    formalizability: not-mathematical
    statement: "The prompt library has no literature-trace prompt; this survey used the problem README's five consilient axes as its organizing frame, surfaced the deviation in prompt.md, and proposes a P10-literature-trace prompt in its own PR."
