strategy: |
  Plan milestone 0 (literature trace), triggered by explicit user
  direction to re-engage 03-p-vs-np after checking prior work. Web
  survey of 2025-01 through 2026-08 along the five consilient axes of
  the problem README, keyed to A012's four residual cracks and the
  re-activation triggers: (i) psd rank / SDP extension complexity of
  the perfect matching polytope; (ii) spectrahedral encodings of
  computation tableaux; (iii) bounded-cancellation arithmetic models;
  (iv) lifting theorems toward uniform models; plus GCT /
  representation theory, meta-complexity, and structural time-space
  complexity. No hypothesis under test, so no P01 panel; the deviation
  (no survey prompt exists in the library) is surfaced in prompt.md
  with a P10 proposal as follow-up. Out of scope: any technical attack
  on a crack (A014+); registering the candidate catalytic/time-space
  bridge (needs a P02 run); the C-002 statement-revision PR.
