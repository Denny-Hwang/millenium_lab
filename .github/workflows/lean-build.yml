name: lean-build

# The mathlib half of the Lean side. The dependency-free ledger has its own
# workflow (lean-ledger.yml) and is excluded here, so a metadata change does
# not pay for a mathlib build.

on:
  pull_request:
    paths:
      - 'formalization/**'
      - '!formalization/ledger/**'
      - 'candidates/**/*.lean'
  push:
    branches: [main]
    paths:
      - 'formalization/**'
      - '!formalization/ledger/**'
      - 'candidates/**/*.lean'

concurrency:
  group: lean-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install elan (Lean toolchain manager)
        run: |
          set -euxo pipefail
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf -o elan-init.sh
          chmod +x elan-init.sh
          ./elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Show Lean version
        working-directory: formalization
        run: lean --version
      - name: Cache mathlib build
        uses: actions/cache@v4
        with:
          path: |
            formalization/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('formalization/lean-toolchain', 'formalization/lakefile.lean', 'formalization/lake-manifest.json') }}
          restore-keys: |
            lake-${{ runner.os }}-
      - name: Fetch prebuilt mathlib oleans
        working-directory: formalization
        # `lake update` is deliberately NOT used: it re-resolves the whole
        # dependency graph on every run, which took hours and never finished
        # inside the timeout. lake-manifest.json is committed, so lake clones
        # exactly the revisions it names, and this step downloads mathlib's
        # prebuilt oleans instead of compiling them. Bump the manifest in the
        # same PR as the tag in lakefile.lean.
        run: lake exe cache get
      - name: Lake build
        working-directory: formalization
        run: lake build
